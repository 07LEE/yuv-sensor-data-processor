[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yuv_sensor"
version = "0.1.0"
description = "Toolkit for decoding raw YUV_420_888 camera frames and aligning IMU sensor logs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "opencv-python>=4.5.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "pillow>=8.0.0",
]

[project.scripts]
yuv-sensor = "yuv_sensor.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["yuv_sensor*"]
