name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "Tag $GITHUB_REF_NAME is not on $DEFAULT_BRANCH. Merge to $DEFAULT_BRANCH and tag there."
            exit 1
          fi

      - name: Check tag matches package version
        run: |
          version=""
          if [ -f pyproject.toml ]; then
            version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          elif [ -f package.json ]; then
            version=$(jq -r .version package.json)
          elif [ -f Cargo.toml ]; then
            version=$(grep -m1 -E '^version *= *"' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          if [ -z "$version" ]; then
            echo "No version file found, skipping"
            exit 0
          fi
          case "$GITHUB_REF_NAME" in
            *-*) echo "Pre-release tag, skipping version comparison"; exit 0 ;;
          esac
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$version"
            exit 1
          fi

      # Build steps are per language. Put release artifacts in dist/.
      - uses: actions/setup-python@v5
        if: hashFiles('pyproject.toml') != ''
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        if: hashFiles('pyproject.toml') != ''
        run: |
          python -m pip install build
          python -m build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          case "$GITHUB_REF_NAME" in
            *-*) args+=(--prerelease) ;;
          esac
          files=()
          if compgen -G "dist/*" > /dev/null; then
            files=(dist/*)
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" "${args[@]}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
